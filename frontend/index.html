<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HuawenShuge</title>
  </head>
  <body>
    <div id="booklist">


    </div>
    </br></br>
    </br></br>
    </br></br>
    <form id="bookForm">
      <label>Name: </label>
      <input name="name">
      <label>Price: </label>
      <input name="price">  
      <button type="submit">Add Book</button>
    </form>
    </br></br>
    <form id="EditForm">
      <label>ID : </label>
      <input name="id"></br>
      <label>Name : </label>
      <input name="name"></br>
      <label>Price : </label>
      <input name="price">
      <button type="submit">Edit</button>
    </form>
    </br></br>
    <form id="delForm">
      <label>ID : </label>
      <input name="id"></br>
      <button type="submit">Delete</button>
    </form>
    <script>
      // +++++++++++++++++++++++++++++ POST +++++++++++++++++++++++++++++
      document.getElementById("bookForm")
      .addEventListener("submit", (event) => {
        event.preventDefault()
        const input1 = document.querySelector('[name="name"]')
        const input2 = document.querySelector('[name="price"]')
        const data = {
          name: input1.value,
          price: Number(input2.value)
        }
        fetch("http://localhost:3000/book",{
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        })
        .then((response) => {
            return response.json()
        })
        .then((data) => {
            console.log(data)
        })
      })
    </script>
    <script>
      //+++++++++++++++++++++++++++++ Edit +++++++++++++++++++++++++++++++++
      document.getElementById("EditForm")
      .addEventListener("submit", (event) => {
        event.preventDefault()
        const form = event.currentTarget
        const input1 = form.querySelector('[name="id"]')
        const input2 = form.querySelector('[name="name"]')
        const input3 = form.querySelector('[name="price"]')
        const id = Number(input1.value)
        const data = {
          name: input2.value,
          price: Number(input3.value)
        }
        fetch("http://localhost:3000/book/"+id,{
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        })
        .then((response) => {
            return response.json()
        })
        .then((data) => {
            console.log(data)
        })
      })
    </script>
    <script>
      //+++++++++++++++++++++++++DELETE+++++++++++++++++++++++++++++++
      document.getElementById("delForm")
      .addEventListener("submit", (event) => {
        event.preventDefault()
        const form = event.currentTarget
        const num1 = form.querySelector('[name="id"]')
        const id = Number(num1.value)
        fetch("http://localhost:3000/book/"+id, {
          method: "DELETE",
        })
        .then((response) => {
            console.log("Deleted >> id: ", id)
        })
      })
    </script>
    <script>
      // ++++++++++++++++++++++++++++++++++ GET +++++++++++++++++++++++
      fetch("http://localhost:3000/book", {
        method: "GET"
      })
      .then((response) => {
            return response.json()
      })
      .then((data) => {
        console.log(data)
        const list = document.getElementById("booklist")
        data.forEach(book => {
          list.innerHTML +=`
          <div>
            <h3>Book name : ${book.name}</h3>
            <div>Price : ${book.price}</div>
            <button data-id="${book.id}">Delete</button>
          </div>`
      });
      const buttons = document.querySelectorAll("button")
      buttons.forEach(button => {
         button.addEventListener("click", () => {
            const id = Number(button.dataset.id)
            fetch("http://localhost:3000/book/"+id, {
                method: "DELETE"
            })
            .then((response) => {
                console.log("Deleted >> id: ", id)
            })
         })
      })
      })
    </script>
    <script>
      
    </script>
  </body>
</html>
