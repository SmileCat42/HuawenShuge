<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HuawenShuge</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: "#F7F1E5",
                        ivory: "#FFFDF8",
                        walnut: "#80513D",
                        olive: "#72765A",
                    },
                },
            },
        };
    </script>
    <style>
        .wishlistBtn.liked {
            color: #dc2626 !important;
            background-color: #fff1f2 !important;
        }
    </style>

</head>


<body class="min-h-screen bg-cream text-stone-800">

    <!-- Header -->
    <header class="border-b border-[#E8D9C8] text-walnut shadow-md">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-5">

            <img src="./public/images/book557.png" alt="HuawenShuge Logo" class="h-auto w-80 max-w-full object-contain" />

            <p class="text-sm text-walnut">
                ค้นพบเรื่องราวผ่านหนังสือจีน
            </p>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 border-b border-[#E8D9C8] bg-walnut/95 shadow-sm">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-2 px-5 py-3">
            <a href="#booklist" class="rounded-lg px-4 py-2 text-sm font-medium text-ivory transition hover:bg-cream hover:text-walnut">
                หนังสือทั้งหมด
            </a>

            <a href="#wishlistList"
                class="rounded-lg px-4 py-2 text-sm font-medium text-ivory transition hover:bg-cream hover:text-walnut">
                รายการโปรด
            </a>

            <a href="#cartList" class="rounded-lg px-4 py-2 text-sm font-medium text-ivory transition hover:bg-cream hover:text-walnut">
                ตะกร้าสินค้า
            </a>

            <a href="#customerOrderList"
                class="rounded-lg px-4 py-2 text-sm font-medium text-ivory transition hover:bg-cream hover:text-walnut">
                คำสั่งซื้อ
            </a>

            <a href="#loginForm"
                class="ml-auto rounded-lg bg-cream px-4 py-2 text-sm font-medium text-walnut transition hover:bg-[#633A29] hover:text-white">
                เข้าสู่ระบบ
            </a>
        </div>
    </nav>


    <h2>Login</h2>

    <form id="loginForm">

        <input type="text" name="username" placeholder="Username">

        <input type="password" name="password" placeholder="Password">

        <button type="submit">
            Login
        </button>

    </form>

    <button id="logoutBtn">
        Logout
    </button>

    <div id="loginResult"></div>

    <h2>Account Profile</h2>

    <div id="profile"></div>

    <button id="editProfileBtn">
        Edit Profile
    </button>
    <div id="editProfileFormContainer" hidden>

        <h3>Edit Profile</h3>

        <form id="editProfileForm">

            <input type="text" name="fname" placeholder="First name">

            <input type="text" name="lname" placeholder="Last name">

            <input type="number" name="birthyear" placeholder="Birth year">

            <input type="text" name="address" placeholder="Address">

            <input type="text" name="tel" placeholder="Telephone">

            <button type="submit">
                Save
            </button>

        </form>

    </div>

    <img id="profileImage" alt="Profile" style="width:150px;">
    <div id="booklist">


    </div>
    </br></br>

    <div id="paymentArea"></div>
    </br></br>

    <section data-role="customer">

        <h3>WishList</h3>
        <div id="wishlistList"></div>

        <h2>Cart</h2>
        <div id="cartList"></div>

        <button id="createOrderBtn">
            Create Order
        </button>

        <div id="orderResult"></div>

        <h2>My Orders</h2>
        <div id="customerOrderList"></div>

    </section>

    <section data-role="employee">

        <h2>Employee - Order Management</h2>
        <div id="employeeOrderList"></div>

        <h2>My Orders</h2>
        <div id="myOrderList"></div>

        <h2>Order Detail</h2>
        <div id="employeeOrderDetail"></div>

    </section>

    </br></br>
    <section data-role="manager" hidden>
        <h2>Manage Employee</h2>

        <div id="eligibleCustomerList"></div>
    </section>
    </br></br>


    <section id="registerSection">

        <h2>Register</h2>

        <form id="registerForm">

            <input type="text" name="fname" placeholder="First name" required>

            <input type="text" name="lname" placeholder="Last name" required>

            <input type="number" name="birthyear" placeholder="Birth year" required>

            <input type="text" name="address" placeholder="Address" required>

            <input type="text" name="tel" placeholder="Telephone" required>

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">
                Register
            </button>

        </form>

        <div id="registerResult"></div>

    </section>

    </br></br>
    </br></br>
    <section data-role="employee">
        <form id="bookForm">
            <label>Name: </label>
            <input name="name">
            <label>Price: </label>
            <input name="price">
            <label>Author : </label>
            <input name="author">
            <label>Detail : </label>
            <input name="detail">
            <input type="file" name="image">
            <button type="submit">Add Book</button>
        </form>
        </br></br>
        <form id="EditForm">
            <label>ID : </label>
            <input name="id"></br>
            <label>Name : </label>
            <input name="name"></br>
            <label>Price : </label>
            <input name="price"></br>
            <label>Author : </label>
            <input name="author"></br>
            <label>Detail : </label>
            <input name="detail"></br>
            <input type="file" name="image">
            <button type="submit">Edit</button>
        </form>
        </br></br>
        <form id="delForm">
            <label>ID : </label>
            <input name="id"></br>
            <button type="submit">Delete</button>
        </form>
    </section>
    <script type="module" src="./script.js"></script>
</body>

</html>
